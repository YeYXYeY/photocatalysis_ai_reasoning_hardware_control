name: Software validation
on: [push, pull_request, workflow_dispatch]
jobs:
  software-only:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'
          cache: pip
          cache-dependency-path: requirements-lock-windows.txt
      - run: python -m pip install -r requirements-lock-windows.txt
      - run: python main.py check
      - run: python main.py demo
      - run: python main.py test
      - run: python -m ruff check .
